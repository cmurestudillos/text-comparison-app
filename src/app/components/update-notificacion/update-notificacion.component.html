@if (updateAvailable) {
  <div class="update-notification">
    <mat-icon class="update-icon">system_update</mat-icon>
    <div class="update-text">
      <p class="update-title">Nueva versión disponible</p>
      <p class="update-subtitle">Actualiza para obtener las últimas mejoras.</p>
    </div>
    <button mat-flat-button color="primary" (click)="updateApp()">Actualizar</button>
  </div>
}
